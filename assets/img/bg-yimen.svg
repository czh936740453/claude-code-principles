<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
  <!-- 依门 · 背景图样：抽象「门 + 倚门人」极简线稿，2x2 四格循环 -->
  <g fill="none" stroke="#6d6d6d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6">
    <!-- 格 1：门 + 倚门人（头 + 斜靠线） -->
    <g>
      <path d="M128 120 A32 32 0 0 1 192 120"/>
      <line x1="128" y1="120" x2="128" y2="250"/>
      <line x1="192" y1="120" x2="192" y2="250"/>
      <circle cx="192" cy="94" r="6"/>
      <line x1="192" y1="101" x2="219" y2="210"/>
    </g>
    <!-- 格 2：门 + 上方圆（日/起点） -->
    <g transform="translate(320,0)">
      <path d="M128 120 A32 32 0 0 1 192 120"/>
      <line x1="128" y1="120" x2="128" y2="250"/>
      <line x1="192" y1="120" x2="192" y2="250"/>
      <circle cx="160" cy="74" r="8"/>
    </g>
    <!-- 格 3：门 + 门槛线 -->
    <g transform="translate(0,320)">
      <path d="M128 120 A32 32 0 0 1 192 120"/>
      <line x1="128" y1="120" x2="128" y2="250"/>
      <line x1="192" y1="120" x2="192" y2="250"/>
      <line x1="116" y1="262" x2="204" y2="262"/>
    </g>
    <!-- 格 4：单门 -->
    <g transform="translate(320,320)">
      <path d="M128 120 A32 32 0 0 1 192 120"/>
      <line x1="128" y1="120" x2="128" y2="250"/>
      <line x1="192" y1="120" x2="192" y2="250"/>
    </g>
  </g>
</svg>